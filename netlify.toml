[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Netlify Forms
# ---------------------------------------------------------------------------
# Netlify auto-detects the static <form data-netlify="true"> markup rendered
# into contact.astro and BookingForm.astro at build time — no extra config
# needed here. Submissions appear under Site → Forms in the Netlify
# dashboard. See README → "Netlify Forms Setup" for notification setup.

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/booking"
  to = "/book"
  status = 301

# Custom 404 (Astro already emits /404.html; this makes the SPA-less
# static fallback explicit for any unmatched route).
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # connect-src includes the booking system's origin so the Rates page can
    # fetch live pricing client-side (see src/lib/live-pricing.ts). This is
    # still the placeholder domain from src/content/settings/settings.yml's
    # `bookingUrl` — once the booking system is deployed to its real domain,
    # update BOTH that CMS field and this origin to match, or the live-pricing
    # fetch will be silently blocked by the browser (it fails closed, so the
    # page still renders fine with static placeholder content either way).
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://unpkg.com; frame-src https://www.facebook.com https://www.google.com; connect-src 'self' https://your-booking-system.example.com https://api.github.com https://github.com https://api.netlify.com https://objects.githubusercontent.com; base-uri 'self'; form-action 'self';"

# Admin should never be indexed and should always fetch fresh (CMS + config).
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

# ---------------------------------------------------------------------------
# Caching — long cache for hashed build assets & images, short for HTML
# ---------------------------------------------------------------------------
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"
