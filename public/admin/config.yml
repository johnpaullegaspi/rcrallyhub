# =============================================================================
# RC Rally Hub — Sveltia CMS configuration
#
# Sveltia CMS is a Decap-CMS-compatible admin UI, so this file uses the same
# well-documented config format. See README.md → "Sveltia CMS Setup" for how
# to connect your GitHub repository and authorize CMS users.
#
# Collections below are ordered and labeled to mirror the site's own nav
# (Home → Book a Court → Rates → Events → Gallery → Videos → About → FAQs →
# Contact), with each page's own editable content grouped right after it, so
# editing "feels" per-page even though Sveltia's collection list is flat.
# =============================================================================

backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/rc-rally-hub # <-- update after pushing to GitHub
  branch: main
  # Auth uses Netlify's built-in OAuth provider for Git-based CMS tools
  # (Site settings → Access control → OAuth in the Netlify dashboard).
  # This is NOT the deprecated Netlify Identity/Git Gateway feature — see
  # README → "Sveltia CMS Authentication" for exact setup steps.

# Optional: uncomment to test content changes locally against your working
# copy before connecting a real repo (`npx sveltia-cms-cli` or Decap's proxy
# server). Leave commented out for production.
# local_backend: true

site_url: https://rcrallyhub.netlify.app
display_url: https://rcrallyhub.netlify.app
logo_url: /images/logo/rc-rally-hub-logo-256.webp

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow

slug:
  encoding: "ascii"
  clean_accents: true

i18n:
  structure: single_file
  locales: [en]

collections:
  # ---------------------------------------------------------------------
  - name: settings
    label: "🏓 Global Settings"
    files:
      - name: settings
        label: "Business Settings"
        file: "src/content/settings/settings.yml"
        fields:
          - { label: "Business Name", name: businessName, widget: string }
          - { label: "Tagline", name: tagline, widget: string, required: false }
          - { label: "Logo", name: logo, widget: image }
          - { label: "Favicon", name: favicon, widget: string, required: false, hint: "Path to favicon.ico in /public" }
          - { label: "Official Address", name: address, widget: string }
          - { label: "Location Description", name: locationDescription, widget: string, hint: "e.g. Inside Garahe by Chef Rods Restaurant" }
          - { label: "Operating Hours (display text)", name: operatingHours, widget: string }
          - { label: "Operating Hours Start (24h HH:mm)", name: operatingHoursStart, widget: string, pattern: ["^([01]\\d|2[0-3]):([0-5]\\d)$", "Use 24-hour HH:mm format"] }
          - { label: "Operating Hours End (24h HH:mm, next day)", name: operatingHoursEnd, widget: string, pattern: ["^([01]\\d|2[0-3]):([0-5]\\d)$", "Use 24-hour HH:mm format"] }
          - label: "Contact Details"
            name: contact
            widget: object
            fields:
              - { label: "Mobile Number", name: mobile, widget: string }
              - { label: "Is Mobile a Dummy/Placeholder?", name: mobileIsDummy, widget: boolean, default: true }
              - { label: "Email", name: email, widget: string }
              - { label: "Is Email a Dummy/Placeholder?", name: emailIsDummy, widget: boolean, default: true }
              - { label: "Facebook (display text)", name: facebook, widget: string }
              - { label: "Is Facebook a Dummy/Placeholder?", name: facebookIsDummy, widget: boolean, default: true }
              - { label: "Messenger URL", name: messenger, widget: string, required: false }
              - { label: "Google Maps Embed URL", name: mapEmbedUrl, widget: string, required: false }
              - { label: "Google Maps Link URL", name: mapUrl, widget: string, required: false }
          - label: "Social Links"
            name: social
            widget: object
            required: false
            fields:
              - { label: "Facebook URL", name: facebook, widget: string, required: false }
              - { label: "Instagram URL", name: instagram, widget: string, required: false }
              - { label: "TikTok URL", name: tiktok, widget: string, required: false }
              - { label: "YouTube URL", name: youtube, widget: string, required: false }
          - label: "Announcement Bar"
            name: announcementBar
            widget: object
            required: false
            fields:
              - { label: "Enabled", name: enabled, widget: boolean, default: false }
              - { label: "Message", name: message, widget: string, required: false }
              - { label: "Link", name: link, widget: string, required: false }
          - { label: "Booking Button Text", name: bookingButtonText, widget: string, default: "Book a Court" }
          - { label: "Booking System URL", name: bookingUrl, widget: string, hint: "Every Book Now button links here — the URL of the separately-deployed booking system (e.g. https://rc-rally-hub-booking.netlify.app/book).", default: "https://your-booking-system.example.com/book" }
          - label: "Footer"
            name: footer
            widget: object
            required: false
            fields:
              - { label: "Description", name: description, widget: text, required: false }
              - { label: "Copyright Name", name: copyrightName, widget: string, required: false }
          - label: "Default SEO"
            name: defaultSeo
            widget: object
            required: false
            fields:
              - { label: "Default SEO Title", name: seoTitle, widget: string, required: false }
              - { label: "Default Meta Description", name: metaDescription, widget: text, required: false }
              - { label: "Default Social Share Image", name: ogImage, widget: image, required: false }

  # ---------------------------------------------------------------------
  # One row per page, ordered exactly like the site's nav (plus the legal/
  # utility pages at the end) — heading, hero image, SEO, and body copy for
  # each page live here.
  - name: pages
    label: "📄 Pages (Heading, Hero, SEO)"
    files:
      - name: home
        label: "🏠 Home"
        file: "src/content/pages/home.md"
        fields: &pageFields
          - { label: "Page Title (internal)", name: title, widget: string }
          - { label: "Heading (H1)", name: heading, widget: string }
          - { label: "Subheading", name: subheading, widget: string, required: false }
          - { label: "Description", name: description, widget: text, required: false }
          - { label: "Hero Image", name: heroImage, widget: image, required: false }
          - { label: "Hero Image Alt Text", name: heroImageAlt, widget: string, required: false }
          - label: "Call-to-Action Buttons"
            name: ctas
            widget: list
            required: false
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "Link", name: href, widget: string }
              - { label: "Style", name: style, widget: select, options: [primary, secondary, ghost], default: primary }
          - { label: "Published", name: published, widget: boolean, default: true }
          - { label: "SEO Title", name: seoTitle, widget: string, required: false }
          - { label: "Meta Description", name: metaDescription, widget: text, required: false }
          - { label: "Open Graph / Social Share Image", name: ogImage, widget: image, required: false }
          - { label: "Body Content (used on About, Privacy, Terms, etc.)", name: body, widget: markdown, required: false }
      - name: book
        label: "📅 Book a Court"
        file: "src/content/pages/book.md"
        fields: *pageFields
      - name: rates
        label: "💰 Rates"
        file: "src/content/pages/rates.md"
        fields: *pageFields
      - name: events
        label: "🏆 Events"
        file: "src/content/pages/events.md"
        fields: *pageFields
      - name: gallery
        label: "🖼️ Gallery"
        file: "src/content/pages/gallery.md"
        fields: *pageFields
      - name: videos
        label: "🎬 Videos"
        file: "src/content/pages/videos.md"
        fields: *pageFields
      - name: about
        label: "🙋 About"
        file: "src/content/pages/about.md"
        fields: *pageFields
      - name: faqs
        label: "❓ FAQs"
        file: "src/content/pages/faqs.md"
        fields: *pageFields
      - name: contact
        label: "☎️ Contact"
        file: "src/content/pages/contact.md"
        fields: *pageFields
      - name: privacy
        label: "📜 Privacy Policy"
        file: "src/content/pages/privacy.md"
        fields: *pageFields
      - name: terms
        label: "📜 Terms of Service"
        file: "src/content/pages/terms.md"
        fields: *pageFields
      - name: cancellation-policy
        label: "📜 Cancellation Policy"
        file: "src/content/pages/cancellation-policy.md"
        fields: *pageFields
      - name: "404"
        label: "🚫 404 Not Found"
        file: "src/content/pages/404.md"
        fields: *pageFields

  # ---------------------------------------------------------------------
  - name: homeContent
    label: "🏠 Home Page — Sections"
    files:
      - name: home
        label: "Highlights, Why Us, Stats & Booking Steps"
        file: "src/content/homeContent/home.yml"
        fields:
          - label: "Quick Highlights (4 cards)"
            name: highlights
            widget: list
            fields:
              - { label: "Icon", name: icon, widget: select, options: [court, calendar, users, trophy, light, clock, seat, heart, building, "map-pin", check] }
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
          - label: "Why Choose Us Cards"
            name: whyChooseUs
            widget: list
            fields:
              - { label: "Icon", name: icon, widget: select, options: [court, calendar, users, trophy, light, clock, seat, heart, building, "map-pin", check] }
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
              - { label: "Mark as Editable Placeholder", name: isPlaceholder, widget: boolean, default: false }
          - label: "Statistics (dummy until official numbers confirmed)"
            name: stats
            widget: list
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "Value", name: value, widget: number, value_type: int }
              - { label: "Suffix", name: suffix, widget: string, default: "+" }
              - { label: "Is Dummy Data?", name: isDummy, widget: boolean, default: true }
          - label: "How Booking Works — Steps"
            name: bookingSteps
            widget: list
            fields:
              - { label: "Step Number", name: step, widget: number, value_type: int }
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }

  # ---------------------------------------------------------------------
  - name: rates
    label: "💰 Rates Page — Packages"
    folder: "src/content/rates"
    identifier_field: name
    summary: "{{name}} — {{price}}"
    fields:
      - { label: "Package Name", name: name, widget: string }
      - { label: "Description", name: description, widget: text }
      - { label: "Price (display text, e.g. 'Starting at ₱250 per hour')", name: price, widget: string }
      - { label: "Billing Unit", name: billingUnit, widget: string, default: "per hour" }
      - { label: "Peak / Off-Peak", name: peakOrOffPeak, widget: select, options: [peak, off-peak, both, "n/a"], default: "n/a" }
      - { label: "Category", name: category, widget: select, options: ["court-rental", equipment, coaching, "open-play", group, tournament, corporate, "private-event"] }
      - { label: "Features", name: features, widget: list, field: { label: Feature, name: feature, widget: string } }
      - { label: "Is Price a Placeholder?", name: isPlaceholderPrice, widget: boolean, default: true }
      - { label: "Display Order", name: displayOrder, widget: number, value_type: int, default: 0 }
      - { label: "Featured", name: featured, widget: boolean, default: false }
      - { label: "Published", name: published, widget: boolean, default: true }

  # ---------------------------------------------------------------------
  - name: addons
    label: "🎾 Rates Page — Booking Add-ons"
    folder: "src/content/addons"
    identifier_field: name
    fields:
      - { label: "Name", name: name, widget: string }
      - { label: "Description", name: description, widget: text, required: false }
      - { label: "Price (display text)", name: price, widget: string }
      - { label: "Unit", name: unit, widget: string, default: "per session" }
      - { label: "Icon", name: icon, widget: select, options: [paddle, ball, whistle, sparkles] }
      - { label: "Display Order", name: displayOrder, widget: number, value_type: int, default: 0 }
      - { label: "Published", name: published, widget: boolean, default: true }

  # ---------------------------------------------------------------------
  - name: events
    label: "🏆 Events Page — Tournaments & Events"
    folder: "src/content/events"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Featured Image", name: image, widget: image }
      - { label: "Image Alt Text", name: imageAlt, widget: string, required: false }
      - { label: "Short Excerpt", name: excerpt, widget: text }
      - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Start Time (24h HH:mm)", name: startTime, widget: string }
      - { label: "End Time (24h HH:mm)", name: endTime, widget: string }
      - { label: "Registration Deadline", name: registrationDeadline, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Category", name: category, widget: select, options: ["Men's Doubles", "Women's Doubles", "Mixed Doubles", "Beginner Division", "Intermediate Division", "Open Division", "All-Male Open Play", "Clinic", "Open Play", "Community"] }
      - { label: "Skill Level", name: skillLevel, widget: string, default: "All Levels" }
      - { label: "Registration Fee (display text)", name: fee, widget: string }
      - { label: "Maximum Participants", name: maxParticipants, widget: number, value_type: int, required: false }
      - { label: "Available Slots", name: availableSlots, widget: number, value_type: int, required: false }
      - { label: "Tournament Format", name: format, widget: text, required: false }
      - { label: "Rules", name: rules, widget: text, required: false }
      - { label: "Prizes", name: prizes, widget: text, required: false }
      - { label: "External Registration Link", name: registrationLink, widget: string, required: false }
      - { label: "Status", name: status, widget: select, options: [Upcoming, "Registration Open", "Registration Closed", Ongoing, Completed, Cancelled] }
      - { label: "Featured", name: featured, widget: boolean, default: false }
      - { label: "Published", name: published, widget: boolean, default: true }
      - { label: "Full Description", name: body, widget: markdown }

  # ---------------------------------------------------------------------
  - name: gallery
    label: "🖼️ Gallery Page — Photos"
    folder: "src/content/gallery"
    identifier_field: title
    summary: "{{title}} ({{category}})"
    fields:
      - { label: "Image", name: image, widget: image }
      - { label: "Thumbnail (optional, defaults to full image)", name: thumbnail, widget: image, required: false }
      - { label: "Title", name: title, widget: string }
      - { label: "Caption", name: caption, widget: string, required: false }
      - { label: "Alt Text (required for accessibility)", name: alt, widget: string }
      - { label: "Category", name: category, widget: select, options: [Court, "Casual Games", "Men's Doubles", "Women's Doubles", "Mixed Doubles", "Open Play", Tournaments, Families, Community, Awarding, "Private Events"] }
      - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Display Order", name: displayOrder, widget: number, value_type: int, default: 0 }
      - { label: "Featured", name: featured, widget: boolean, default: false }
      - { label: "Published", name: published, widget: boolean, default: true }

  # ---------------------------------------------------------------------
  - name: videos
    label: "🎬 Videos Page — Videos (Facebook)"
    folder: "src/content/videos"
    identifier_field: title
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Description", name: description, widget: text, required: false }
      - { label: "Facebook Reel URL (public link)", name: facebookReelUrl, widget: string, hint: "The normal facebook.com/.../videos/... link" }
      - label: "Approved Embed URL"
        name: approvedEmbedUrl
        widget: string
        hint: "MUST start with https://www.facebook.com/plugins/video.php — generate at https://developers.facebook.com/docs/plugins/embedded-video-player. The site only renders embeds from this exact domain for safety. Autoplay is applied automatically when the visitor clicks play — you do not need to add &autoplay=true yourself."
      - { label: "Poster / Thumbnail Image", name: posterImage, widget: image }
      - { label: "Poster Alt Text", name: posterImageAlt, widget: string, required: false }
      - { label: "Category", name: category, widget: string, default: "Highlights" }
      - { label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Display Order", name: displayOrder, widget: number, value_type: int, default: 0 }
      - { label: "Featured", name: featured, widget: boolean, default: false }
      - { label: "Published", name: published, widget: boolean, default: true }

  # ---------------------------------------------------------------------
  - name: aboutContent
    label: "🙋 About Page — Sections"
    files:
      - name: about
        label: "Values, Team & Partners"
        file: "src/content/aboutContent/about.yml"
        fields:
          - label: "Community Values"
            name: values
            widget: list
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Description", name: description, widget: text }
          - label: "Team & Staff"
            name: team
            widget: list
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Role", name: role, widget: string }
              - { label: "Photo", name: photo, widget: image, required: false }
              - { label: "Is Placeholder?", name: isPlaceholder, widget: boolean, default: true }
          - label: "Community Partners"
            name: partners
            widget: list
            fields:
              - { label: "Name", name: name, widget: string }
              - { label: "Description", name: description, widget: text, required: false }
              - { label: "Logo", name: logo, widget: image, required: false }

  # ---------------------------------------------------------------------
  - name: testimonials
    label: "💬 Testimonials (Home & About)"
    folder: "src/content/testimonials"
    identifier_field: customerName
    summary: "{{customerName}} — {{customerType}}"
    fields:
      - { label: "Customer Name", name: customerName, widget: string }
      - { label: "Customer Type", name: customerType, widget: string, hint: "e.g. Weekend Player, Tournament Participant" }
      - { label: "Avatar Photo", name: avatar, widget: image, required: false }
      - { label: "Rating (1-5)", name: rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
      - { label: "Testimonial Text", name: testimonial, widget: text }
      - { label: "Display Order", name: displayOrder, widget: number, value_type: int, default: 0 }
      - { label: "Featured", name: featured, widget: boolean, default: false }
      - { label: "Published", name: published, widget: boolean, default: true }

  # ---------------------------------------------------------------------
  - name: faqs
    label: "❓ FAQs Page — Questions"
    folder: "src/content/faqs"
    identifier_field: question
    fields:
      - { label: "Question", name: question, widget: string }
      - { label: "Answer", name: answer, widget: text }
      - { label: "Category", name: category, widget: select, options: [Booking, "Rates & Payment", "Venue & Hours", "Rules & Policies", Events, Equipment] }
      - { label: "Display Order", name: displayOrder, widget: number, value_type: int, default: 0 }
      - { label: "Published", name: published, widget: boolean, default: true }
      - { label: "Use as Chatbot Answer", name: useAsChatbotAnswer, widget: boolean, default: true }

  # ---------------------------------------------------------------------
  - name: chatbot
    label: "🤖 Rally Assistant Chatbot (Site-Wide)"
    files:
      - name: chatbot
        label: "Chatbot Settings"
        file: "src/content/chatbot/chatbot.yml"
        fields:
          - { label: "Enabled", name: enabled, widget: boolean, default: true }
          - { label: "Chatbot Name", name: chatbotName, widget: string, default: "Rally Assistant" }
          - { label: "Greeting Message", name: greeting, widget: text }
          - { label: "Fallback Message (when no answer is found)", name: fallbackMessage, widget: text }
          - { label: "Notification Delay (seconds)", name: notificationDelaySeconds, widget: number, value_type: int, default: 4 }
          - { label: "Booking Link", name: bookingLink, widget: string, default: "/book" }
          - label: "Quick Replies"
            name: quickReplies
            widget: list
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "Intent", name: intent, widget: select, options: [booking, rates, schedules, hours, location, amenities, equipment, events, cancellation, rescheduling, contact, midnight] }
          - label: "Contact Actions"
            name: contactActions
            widget: list
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "Type", name: type, widget: select, options: [call, email, facebook, contact-form, link] }
              - { label: "Value (URL, tel:, or mailto:)", name: value, widget: string }

  # ---------------------------------------------------------------------
  - name: policies
    label: "📜 Policies (Privacy, Terms, Cancellation)"
    folder: "src/content/policies"
    identifier_field: title
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Last Updated", name: lastUpdated, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Published", name: published, widget: boolean, default: true }
      - { label: "Body", name: body, widget: markdown }
