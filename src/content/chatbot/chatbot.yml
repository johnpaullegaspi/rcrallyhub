enabled: true
chatbotName: "Rally Assistant"
greeting: "Hi! Welcome to RC Rally Hub. How can I help you start your next rally?"
fallbackMessage: "I'm sorry, I don't have that information yet. You can contact the RC Rally Hub team for assistance."
notificationDelaySeconds: 4
bookingLink: "/book"
quickReplies:
  - label: "Book a Court"
    intent: "booking"
  - label: "Check Court Rates"
    intent: "rates"
  - label: "View Available Schedules"
    intent: "schedules"
  - label: "Upcoming Tournaments"
    intent: "events"
  - label: "Operating Hours"
    intent: "hours"
  - label: "Venue Location"
    intent: "location"
  - label: "Equipment Rental"
    intent: "equipment"
  - label: "Contact RC Rally Hub"
    intent: "contact"
contactActions:
  - label: "Call Us"
    type: "call"
    value: "tel:+639175557288"
  - label: "Send an Email"
    type: "email"
    value: "mailto:play@rcrallyhub.com"
  - label: "Message on Facebook"
    type: "facebook"
    value: "https://facebook.com/RCRallyHub"
  - label: "Open Contact Form"
    type: "contact-form"
    value: "/contact"
