bookingSteps:
  - step: 1
    title: "Choose your date and time"
    description: "Pick a business date and an available hourly slot — our schedule runs 6:00 AM to 3:00 AM, so late-night rallies are covered too."
  - step: 2
    title: "Select duration and options"
    description: "Choose how long you'll play and add players, paddle or ball rental, or a coaching session."
  - step: 3
    title: "Enter your contact information"
    description: "Tell us who's playing so we can confirm your reservation and reach you if needed."
  - step: 4
    title: "Submit and receive confirmation"
    description: "You'll get a reference number instantly with Pending Confirmation status while our team finalizes your slot."
